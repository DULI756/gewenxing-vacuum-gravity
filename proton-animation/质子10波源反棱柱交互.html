<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>质子 10 波源 · 反棱柱自旋与发散波干涉（交互）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%230d1220' stroke='%23ffb84d' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23fff6d0'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b1020; --panel:#121a2e; --line:#2a3a55; --txt:#d7e2f5;
    --acc:#ffb84d; --dim:#8ba0bf; --green:#6fe0a0; --red:#ff9d9d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #legend{position:absolute;left:14px;bottom:12px;font-size:13px;color:var(--dim);
    background:rgba(11,16,32,.72);padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    line-height:1.7;max-width:230px}
  #legend b{color:var(--txt)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  #bar{height:74px;background:var(--panel);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:20px;padding:0 18px;flex-wrap:wrap}
  #bar .g{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  label{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:10px}
  input[type=range]{width:190px;accent-color:var(--acc);cursor:pointer}
  input[type=number]{width:78px;background:#1c2942;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;text-align:center}
  input[type=number]:focus{outline:none;border-color:#5a92cf}
  #fval{display:inline-block;min-width:44px;text-align:center;color:var(--acc);
    font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  button{background:#1c2942;color:var(--txt);border:1px solid var(--line);
    padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13px;transition:background .15s;
    font-family:inherit;min-height:44px;min-width:44px}
  button:hover{background:#263657}
  button.on{background:#3a6ea5;border-color:#5a92cf}
  #hint{font-size:12px;color:var(--dim);margin-left:auto;opacity:.9}
  @media (max-width:640px){
    #bar{height:auto;padding:10px 12px;gap:12px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="legend">
      <div><span class="sw" style="background:#ffd97a"></span><b>波源</b>（10：反棱柱8 + 上下轴2）</div>
      <div><span class="sw" style="background:#ffc86e"></span><b>层状爆发</b>（能量层亮 / 真空层暗，一层层向外）</div>
      <div><span class="sw" style="background:#4669af"></span>真空层（间歇/引力层）</div>
      <div><span class="sw" style="background:#6fe0a0"></span>能量层 r≈0.67（腔半径 R）</div>
      <div><span class="sw" style="background:#ff9d9d"></span>真空0压层 r≈0.93（发散型驻波层）</div>
      <div style="margin-top:4px"><b>自旋</b>：中间8源绕轴慢转；上下轴源快转</div>
    </div>
  </div>
  <div id="bar">
    <div class="g">
      <label>爆发频率
        <input id="freq" type="range" min="0" max="100" value="33.33">
        <input id="fnum" type="number" min="0.01" step="0.1" value="1">
        <span id="fval">1.00×</span>
      </label>
      <label>自旋速度
        <input id="spin" type="range" min="0" max="100" value="33.33">
        <input id="spinnum" type="number" min="0.01" step="0.1" value="1">
        <span id="spinv">1.00×</span>
      </label>
      <button id="play">暂停</button>
      <button id="reset">重置</button>
    </div>
    <div id="hint">拖动滑块/填数：爆发频率 · 自旋速度（均无上限）· 相机自动旋转</div>
  </div>
</div>

<script>
(function(){try{

  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var freqEl=document.getElementById('freq'), fval=document.getElementById('fval');
  var spinEl=document.getElementById('spin'), spinv=document.getElementById('spinv'),
      spinnum=document.getElementById('spinnum');
  var playBtn=document.getElementById('play'), resetBtn=document.getElementById('reset');

  // ---------- 几何与常量（波源理论 v3） ----------
  var A=0.40/3, H=0.40/3, ZAX=0.60/3;   // 反棱柱外接半径、半高、轴端（波源间距缩到 1/3）
  var OM_M=0.55, OM_AX=1.7;       // 中间8源自旋（慢）、上下轴源自旋（快）
  var LAM=1.06, K=2*Math.PI/LAM;
  var BASE_B=[0,90,180,270], BASE_T=[45,135,225,315]; // 上下面 45° 扭曲

  // ---------- 状态 ----------
  var running=true, t=0, tPhase=0, tCam=0;
  var freq=1, spinMul=1, activeP=300;
  var lastTs=null;

  // ---------- 源位置（含自旋） ----------
  function srcPos(){
    var rm=OM_M*spinMul*t, p=[], i,b;
    for(i=0;i<4;i++){ b=BASE_B[i]*Math.PI/180+rm; p.push([A*Math.cos(b),-H,A*Math.sin(b)]); }
    for(i=0;i<4;i++){ b=BASE_T[i]*Math.PI/180+rm; p.push([A*Math.cos(b),H,A*Math.sin(b)]); }
    p.push([0,-ZAX,0]); p.push([0,ZAX,0]);
    return p;
  }

  // ---------- 场点（球内；粒子数随爆发频率动态增长，无上限） ----------
  var FX=[], FY=[], FZ=[];
  var seedState=7;
  function rnd01(){ seedState=(seedState*1664525+1013904223)>>>0; return seedState/4294967296; }
  function ensurePoints(n){
    while(FX.length<n){
      var batch=Math.min(4000, n-FX.length);
      for(var b=0;b<batch;b++){
        var rr=Math.pow(rnd01(),1/3)*1.06;
        var th=rnd01()*2*Math.PI, ph=Math.acos(2*rnd01()-1);
        FX.push(rr*Math.sin(ph)*Math.cos(th));
        FY.push(rr*Math.cos(ph));
        FZ.push(rr*Math.sin(ph)*Math.sin(th));
      }
    }
  }
  ensurePoints(300);

  // ---------- 波前方向（球面采样） ----------
  var dirs=[];
  (function(){
    var PR=3, PL=6;
    for(var a=0;a<PR;a++){
      var az=a/PR*2*Math.PI;
      for(var b=1;b<PL-1;b++){
        var el=Math.PI*b/(PL-1);
        dirs.push([Math.cos(az)*Math.sin(el), Math.cos(el), Math.sin(az)*Math.sin(el)]);
      }
    }
  })();

  // ---------- 相机投影 ----------
  var yaw0=0.6, pitch=0.42, focal=3.4;
  function project(x,y,z){
    var cy=yaw0+tCam*0.25, cp=pitch;
    var x1=x*Math.cos(cy)-z*Math.sin(cy);
    var z1=x*Math.sin(cy)+z*Math.cos(cy);
    var y1=y;
    var y2=y1*Math.cos(cp)-z1*Math.sin(cp);
    var z2=y1*Math.sin(cp)+z1*Math.cos(cp);
    var sc=focal/(focal+z2);
    return [cv.width/2 + x1*sc*Math.min(cv.width,cv.height)*0.42,
            cv.height/2 - y2*sc*Math.min(cv.width,cv.height)*0.42,
            z2];
  }

  // ---------- 颜色映射 ----------
  function colWav(v){ // v in [-1,1]
    var t2=(v+1)/2;
    var c0=[6,10,28], c1=[16,32,58], c2=[255,184,77], c3=[255,246,208];
    var a,b,c,r,g,bl;
    if(t2<0.45){ a=c0;b=c1;c=(t2-0)/0.45; }
    else if(t2<0.72){ a=c1;b=c2;c=(t2-0.45)/0.27; }
    else { a=c2;b=c3;c=(t2-0.72)/0.28; }
    r=Math.round(a[0]+(b[0]-a[0])*c);
    g=Math.round(a[1]+(b[1]-a[1])*c);
    bl=Math.round(a[2]+(b[2]-a[2])*c);
    return 'rgb('+r+','+g+','+bl+')';
  }

  // ---------- 场值 ----------
  function field(src, phase, n){
    var out=new Float32Array(n), d, s, i;
    for(i=0;i<n;i++){
      var v=0;
      for(s=0;s<10;s++){
        d=Math.sqrt((FX[i]-src[s][0])*(FX[i]-src[s][0])+
                    (FY[i]-src[s][1])*(FY[i]-src[s][1])+
                    (FZ[i]-src[s][2])*(FZ[i]-src[s][2]));
        v+=Math.cos(K*d-phase)/(1+d*d*0.4);
      }
      out[i]=v/10;
    }
    return out;
  }

  // ---------- 绘制 ----------
  function draw(){
    var W=cv.width, Hc=cv.height;
    ctx.clearRect(0,0,W,Hc);
    ctx.fillStyle='#0b1020';
    ctx.fillRect(0,0,W,Hc);

    var src=srcPos();
    var phase=2*Math.PI*freq*t;
    var fv=field(src,phase,activeP);

    var pts=[]; // {sx,sy,size,color,alpha,depth}

    // 场粒子（数量随频率 activeP）
    var i;
    for(i=0;i<activeP;i++){
      var pr=project(FX[i],FY[i],FZ[i]);
      pts.push([pr[0],pr[1],1.6,colWav(fv[i]),0.85,pr[2]]);
    }

    // 层状爆发结构：每源 6 层同心壳，能量层(亮)/真空层(暗)交替，整组随爆发径向扩张
    var NC=6, s, k, d;
    for(s=0;s<10;s++){
      var frac=(t*freq)%1;
      var base=0.08+frac*0.55;
      for(k=0;k<NC;k++){
        var r=base+k*0.15;
        var bright=(k%2===0);                       // 亮暗交替 → 一层一层
        var col=bright?'rgb(255,200,110)':'rgb(70,105,175)';
        var al=bright?(0.55-0.25*frac):(0.28-0.12*frac);
        var sz=bright?2.4:1.8;
        for(d=0;d<dirs.length;d++){
          var px=src[s][0]+dirs[d][0]*r;
          var py=src[s][1]+dirs[d][1]*r;
          var pz=src[s][2]+dirs[d][2]*r;
          pr=project(px,py,pz);
          pts.push([pr[0],pr[1],sz,col,al,pr[2]]);
        }
      }
    }

    // 波源本体（柔和光晕）
    for(s=0;s<10;s++){
      pr=project(src[s][0],src[s][1],src[s][2]);
      pts.push([pr[0],pr[1],6,'rgba(255,217,122,0.8)',1,pr[2]]);
    }

    // 上下轴源自旋指示光点（快转）
    var ra=OM_AX*spinMul*t, g=0.05;
    var k;
    for(k=0;k<2;k++){
      var ang=ra + k*Math.PI;
      var yy=(k===0)? -ZAX : ZAX;
      pr=project(g*Math.cos(ang), yy, g*Math.sin(ang));
      pts.push([pr[0],pr[1],5,'rgb(255,224,138)',0.95,pr[2]]);
    }

    // 反棱柱骨架（8 源间连线）
    var e, edges=[];
    for(i=0;i<4;i++){
      edges.push([i,(i+1)%4]);
      edges.push([4+i,4+(i+1)%4]);
      edges.push([i,4+i]);
      edges.push([i,4+(i+1)%4]);
    }
    var mid=[];
    for(e=0;e<edges.length;e++){
      var a0=edges[e][0], b0=edges[e][1];
      var p1=project(src[a0][0],src[a0][1],src[a0][2]);
      var p2=project(src[b0][0],src[b0][1],src[b0][2]);
      mid.push([p1,p2]);
    }

    // 按深度排序（远先画）
    pts.sort(function(x,y){return x[5]-y[5];});

    // 画骨架线（深度平均）
    for(e=0;e<mid.length;e++){
      ctx.strokeStyle='rgba(127,178,255,0.45)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(mid[e][0][0],mid[e][0][1]);
      ctx.lineTo(mid[e][1][0],mid[e][1][1]);
      ctx.stroke();
    }

    // 画点
    for(i=0;i<pts.length;i++){
      ctx.globalAlpha=pts[i][4];
      ctx.fillStyle=pts[i][3];
      ctx.beginPath();
      ctx.arc(pts[i][0],pts[i][1],pts[i][2],0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // ---------- 主循环 ----------
  function frame(ts){
    if(lastTs==null) lastTs=ts;
    var dt=(ts-lastTs)/1000; lastTs=ts;
    if(dt>0.05) dt=0.05;
    if(running){
      t+=dt;
      tCam+=dt;
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- 控件 ----------
  // ---------- 频率：滑块对数刻度(0.1~100×) + 数值框(任意,无上限) ----------
  function posToFreq(p){ return 0.1*Math.pow(1000, p/100); }
  function freqToPos(f){ return 100*Math.log10(f/0.1)/3; }
  function setFreq(f){
    if(!isFinite(f)||f<=0) f=1;
    freq=f;
    activeP=Math.max(100, Math.round(300*freq)); // 粒子数随频率增加，无上限
    ensurePoints(activeP);
    fval.textContent=freq.toFixed(2)+'×';
    fnum.value=Math.round(freq*100)/100;
    var pos=freqToPos(freq);
    if(pos<0)pos=0; if(pos>100)pos=100;
    freqEl.value=pos;
  }
  freqEl.addEventListener('input',function(){ setFreq(posToFreq(parseFloat(freqEl.value))); });
  fnum.addEventListener('input',function(){ setFreq(parseFloat(fnum.value)||1); });
  setFreq(1);

  // ---------- 自旋速度：滑块对数刻度(0.1~100×) + 数值框(任意,无上限) ----------
  function posToSpin(p){ return 0.1*Math.pow(1000, p/100); }
  function spinToPos(s){ return 100*Math.log10(s/0.1)/3; }
  function setSpin(s){
    if(!isFinite(s)||s<=0) s=1;
    spinMul=s;
    spinv.textContent=spinMul.toFixed(2)+'×';
    spinnum.value=Math.round(spinMul*100)/100;
    var pos=spinToPos(spinMul);
    if(pos<0)pos=0; if(pos>100)pos=100;
    spinEl.value=pos;
  }
  spinEl.addEventListener('input',function(){ setSpin(posToSpin(parseFloat(spinEl.value))); });
  spinnum.addEventListener('input',function(){ setSpin(parseFloat(spinnum.value)||1); });
  setSpin(1);
  playBtn.addEventListener('click',function(){
    running=!running;
    playBtn.textContent=running?'暂停':'播放';
    playBtn.classList.toggle('on',!running);
  });
  resetBtn.addEventListener('click',function(){
    t=0; tCam=0;
  });

  // ---------- resize ----------
  function resize(){
    var st=document.getElementById('stage');
    cv.width=st.clientWidth; cv.height=st.clientHeight;
  }
  window.addEventListener('resize',resize);
  resize();

  requestAnimationFrame(frame);

}catch(err){ console.error(err); }})();
</script>
</body>
</html>
